<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Real icon FILES, not the inline data: URI this used to carry.
         A data: URI is not a URL Googlebot-Image can crawl, which is
         why search results showed a generic globe for this site while
         app.perchmarkets.com (whose icon is a real file) showed the
         mark. /favicon.ico matters independently: browsers and Google
         both probe it directly, and not_found_handling=
         single-page-application answers any missing path with the HTML
         shell at 200 -- so an absent favicon.ico isn't a 404, it's a
         page pretending to be an image.
         All of these are generated by web/scripts/gen_favicons.py from
         the same mark as FALCON_PATHS in src/components/PerchMark.jsx
         (still a deliberate duplicate -- static HTML can't import a JS
         module); re-run it when the mark changes. See BRAND.md. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/brand/perch-mark.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/icon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/brand/icon-96.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="/brand/icon-144.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#05070a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Perch watches the market continuously and tells you the moment something unusual happens. It never trades. It just notices." />
    <link rel="canonical" href="https://perchmarkets.com/" />
    <title>Perch — the market moves. Perch notices.</title>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://perchmarkets.com/" />
    <meta property="og:title" content="Perch Markets — See What Matters" />
    <meta property="og:description" content="Perch watches the market, detects unusual activity, and gives you the context behind the signal." />
    <meta property="og:image" content="https://perchmarkets.com/brand/og-landing.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Perch Markets — See What Matters" />
    <meta name="twitter:description" content="Perch watches the market, detects unusual activity, and gives you the context behind the signal." />
    <meta name="twitter:image" content="https://perchmarkets.com/brand/og-landing.png" />
  </head>
  <body>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
