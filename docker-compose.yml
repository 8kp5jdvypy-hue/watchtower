# Production stack for a single VPS. Four services on the scanner/bot
# side, one image (see Dockerfile) — mirrors what scripts/start.sh runs
# on bare metal, but supervised by Docker instead of pidfiles:
# `restart: unless-stopped` is this deployment's watchdog, so
# scripts/watchdog.sh and the LaunchAgent plists are the macOS-laptop
# equivalent and are not used here. `caddy` is the fifth service — the
# only thing with a port published to the host — terminating TLS for
# api.perchmarkets.com and reverse-proxying to `api`. See
# docs/DEPLOYMENT.md for the DNS record `api` needs.
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f runner
#   docker compose restart bot
services:
  worker:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: python -m tradebot.telegram_bot.worker
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  bot:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: python -m tradebot.telegram_bot.main
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - worker
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  runner:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: python -m tradebot.runner --live --broad-scan
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - worker
    healthcheck:
      # Same staleness contract as scripts/status.sh: if the scanner
      # hasn't written a heartbeat in 15 minutes, something's wrong.
      # During market close the process exits on its own (see
      # runner.py's run_live loop) — Docker will then restart it into a
      # fast no-op idle state, not a crash loop, since run_live's own
      # session-bounds check makes an off-hours start a quick return.
      # maybe_send_session_open_messages guards the morning
      # briefing/pre-open card against resending on that restart.
      test: ["CMD", "python", "-c", "import json,sys,time; from datetime import datetime; d=json.load(open('data/heartbeat.json')); age=time.time()-datetime.fromisoformat(d['ts_utc']).timestamp(); sys.exit(0 if age < 900 else 1)"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: gunicorn tradebot.api.wsgi:app -b 0.0.0.0:8000 --workers 2
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - worker
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
