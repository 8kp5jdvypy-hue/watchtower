# Production stack for a single VPS. Seven services on the scanner/bot
# side, one image (see Dockerfile) — mirrors what scripts/start.sh runs
# on bare metal, but supervised by Docker instead of pidfiles:
# `restart: unless-stopped` is this deployment's watchdog, so
# scripts/watchdog.sh and the LaunchAgent plists are the macOS-laptop
# equivalent and are not used here. `caddy` is the eighth service — the
# only thing with a port published to the host — terminating TLS for
# api.perchmarkets.com and reverse-proxying to `api`. See
# docs/DEPLOYMENT.md for the DNS record `api` needs.
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f runner
#   docker compose restart bot
services:
  worker:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: python -m tradebot.telegram_bot.worker
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  bot:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: python -m tradebot.telegram_bot.main
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - worker
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  runner:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: python -m tradebot.runner --live --broad-scan
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - worker
    healthcheck:
      # The runner intentionally idles without writing heartbeats outside
      # RTH. During an actual XNYS session, require a fresh evaluation;
      # off-hours, Docker's process supervision is the liveness signal.
      test: ["CMD", "python", "-m", "tradebot.runner_health", "--heartbeat", "data/heartbeat.json", "--max-age", "900"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postmarket:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: python -m tradebot.postmarket_shadow
    env_file: .env
    environment:
      # Shadow storage only. The default-off kill switch makes a routine
      # deploy incapable of starting vendor polling by accident.
      POSTMARKET_SHADOW_ENABLED: ${POSTMARKET_SHADOW_ENABLED:-0}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      # Disabled and off-window are intentionally healthy. While the
      # observer is enabled and its real XNYS postmarket window is active,
      # require a fresh non-error heartbeat.
      test: ["CMD", "python", "-m", "tradebot.postmarket_health", "--heartbeat", "data/postmarket_heartbeat.json", "--max-age", "600"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postmarket-discovery:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: python -m tradebot.postmarket_discovery_shadow
    env_file: .env
    environment:
      # Independent default-off kill switch. This service has no alert,
      # Telegram, outbox, broker, or order-routing dependency.
      POSTMARKET_DISCOVERY_ENABLED: ${POSTMARKET_DISCOVERY_ENABLED:-0}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "tradebot.postmarket_discovery_health", "--heartbeat", "data/postmarket_discovery_heartbeat.json", "--max-age", "600"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postmarket-external-context:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: python -m tradebot.postmarket_external_context_shadow
    env_file: .env
    environment:
      # Slow options/news enrichment is isolated from the one-minute
      # discovery loop and remains independently default-off.
      POSTMARKET_EXTERNAL_CONTEXT_ENABLED: ${POSTMARKET_EXTERNAL_CONTEXT_ENABLED:-0}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "tradebot.postmarket_external_context_health", "--heartbeat", "data/postmarket_external_context_heartbeat.json", "--max-age", "600"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: gunicorn tradebot.api.wsgi:app -b 0.0.0.0:8000 --workers 2
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - worker
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    # request_body in Caddyfile requires Caddy 2.10+; pin the validated
    # production image so a cached pre-2.10 `caddy:2-alpine` cannot make
    # the next deploy reject the configuration.
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
